[package]
name = "omarchy-control-center"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Centralized inventory and controlled lifecycle operations for software installed on Omarchy / Arch Linux"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
