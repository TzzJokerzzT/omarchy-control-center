# Omarchy Control Center configuration.
#
# Copy to ~/.config/omarchy-control-center/config.toml
# A missing file is not an error; an invalid file is reported and the defaults are
# used, so a typo never prevents the inventory from opening.

# Explore the inventory without exposing any destructive action.
# Equivalent to starting the program with --read-only.
read_only = false

# Extra directories searched for tools such as pacman, yay or flatpak.
# They are prepended in this order, before the inherited PATH: the first directory
# that provides a program wins. Use this to point the program at a wrapper or at a
# tool installed outside the default prefix.
extra_search_paths = []
# extra_search_paths = ["/usr/local/bin", "/home/you/.local/bin"]

# Colour scheme. Must match a theme id: run the program, press 't' and the selector shows
# each theme's id, or look in docs/themes.md. A theme pinned here wins over the one chosen
# in the selector.
# theme = "cyberpunk"

# Ask the release API once at startup whether a newer version exists, and show it in the
# header. Off by default: this is the only thing in the program that touches the network.
# It never installs anything; use 'control-center --update --yes' for that.
check_for_updates = false
