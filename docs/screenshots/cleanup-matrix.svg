  <text x="20" y="127" fill="#b8ffb8" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" xml:space="preserve">This screen lists only leftovers that no manager owns: plugin removal backups and Hyprland backup copies.</text>
