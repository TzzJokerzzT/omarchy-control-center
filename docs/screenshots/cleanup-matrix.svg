  <text x="12" y="76" fill="#c8ff4f" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" xml:space="preserve">┌ CLEANUP — 0 leftover(s) 0 B · selected 0 B ──────────────────────────────────────────────────────────────┐</text>
