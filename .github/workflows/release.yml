name: release

# Triggered by a tag, so the release is exactly the tagged source. It builds the binary,
# publishes a SHA256SUMS asset next to it, and creates the GitHub release. Without that
# checksum asset the client refuses to install an update, so this workflow is what makes
# `--update` possible at all.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Rust toolchain
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup toolchain install stable --profile minimal --no-self-update
            rustup default stable
          fi
          rustc --version

      # The tag and Cargo.toml must agree: a release whose binary reports a different
      # version than its tag would make every future update check wrong.
      - name: Tag matches the version in Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag: $tag"
          echo "Cargo.toml: $declared"
          if [ "$tag" != "$declared" ]; then
            echo "::error::the tag v$tag does not match Cargo.toml version $declared"
            exit 1
          fi

      # A tag does not trigger ci.yml, which only listens to pushes and pull requests on main.
      # Without this gate a tag could publish code that never ran the checks a contributor is
      # asked to run — and a published binary cannot be taken back from the people who
      # installed it.
      - name: Gate
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

      - name: Build
        run: cargo build --release --locked

      - name: Package the binary and its checksum
        run: |
          mkdir -p dist
          cp target/release/omarchy-control-center dist/omarchy-control-center-x86_64-linux
          chmod 755 dist/omarchy-control-center-x86_64-linux
          cd dist
          sha256sum omarchy-control-center-x86_64-linux > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag carrying a suffix (`v0.4.0-rc1`) is a prerelease, and must be marked as one:
          # /releases/latest answers with the newest release that is NOT a prerelease, so an
          # unmarked candidate would be offered to everyone as a stable update.
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for what changed in this version." \
            $prerelease \
            dist/omarchy-control-center-x86_64-linux \
            dist/SHA256SUMS
