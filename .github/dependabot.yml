# A pinned action SHA is a frozen dependency: correct today, silently old tomorrow.
# The `github-actions` entry is what keeps the pins in the workflows current, which is the
# price of pinning them by commit instead of by tag.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # The lockfile is committed and the release builds with --locked, so a security fix in a
  # dependency only reaches users when Cargo.lock moves.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
